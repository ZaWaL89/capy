name: Build Car APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Check Roadcast binaries
        run: |
          ls -l android/app/src/main/assets/roadcastd
          ls -l android/app/src/main/jniLibs/arm64-v8a/libroadcast_client.so
          
      - name: Bump build number above 783
        run: |
          sed -i 's/^version: .*/version: 0.26.0+800/' pubspec.yaml
             
      - run: flutter pub get

      - name: Generate platform keystore
        run: bash scripts/generate_platform_keystore.sh

      - name: Point the car app at your cloud
        run: |
          {
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
            echo "SUPABASE_FUNCTIONS_URL=${{ secrets.SUPABASE_URL }}/functions/v1"
          } >> android/local.properties

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: car-apk
          path: build/app/outputs/flutter-apk/app-release.apk
