name: Build Car APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_FUNCTIONS_URL: ${{ secrets.SUPABASE_URL }}/functions/v1
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
      CLOUD_SYNC_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Check Roadcast binaries
        run: |
          ls -l android/app/src/main/assets/roadcastd
          ls -l android/app/src/main/jniLibs/arm64-v8a/libroadcast_client.so

      - name: Bump build number
        run: |
          sed -i 's/^version: .*/version: 0.26.0+803/' pubspec.yaml

      - name: Create .env
        run: |
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_PUBLISHABLE_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env

      - run: flutter pub get

      - name: Generate platform keystore
        run: bash scripts/generate_platform_keystore.sh

      - name: Write native cloud config
        run: |
          touch android/local.properties
          {
            echo "SUPABASE_FUNCTIONS_URL=$SUPABASE_FUNCTIONS_URL"
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "CLOUD_SYNC_ENABLED=true"
          } >> android/local.properties

      - run: flutter build apk --release --dart-define-from-file=.env

      - name: Show cloud config baked into the build
        run: |
          f=$(find . -name BuildConfig.java -path "*release*" | head -1)
          echo "BuildConfig: $f"
          grep -E "SUPABASE_(FUNCTIONS_)?URL|CLOUD_SYNC" "$f" || true

      - uses: actions/upload-artifact@v4
        with:
          name: car-apk
          path: build/app/outputs/flutter-apk/app-release.apk
